name: Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36'

      - name: Install
        run: npm ci

      - name: Type-check and unit tests
        run: |
          npm run typecheck
          npm test

      - name: Build web app and sync into Android
        run: npm run android:sync

      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$PKG" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG"
            exit 1
          fi

      - name: Build APKs
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
            export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"
            echo "Signing with the private release key from secrets."
          else
            echo "::warning::No signing secrets set. Signing with the public sideload key (see PLAN.md)."
          fi
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Collect APKs
        id: collect
        run: |
          mkdir -p out
          VERSION="$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then NAME="Sasta-v${VERSION}-android"; else NAME="Sasta-v${VERSION}-${GITHUB_SHA::7}-android"; fi
          cp android/app/build/outputs/apk/release/app-release.apk "out/${NAME}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/${NAME}-debug.apk"
          (cd out && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: sasta-apk
          path: out/*
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="docs/releases/${GITHUB_REF_NAME}.md"
          if [ -f "$NOTES" ]; then NOTES_ARGS=(--notes-file "$NOTES"); else NOTES_ARGS=(--generate-notes); fi
          gh release create "$GITHUB_REF_NAME" out/Sasta-*.apk out/SHA256SUMS.txt \
            --title "Sasta ${GITHUB_REF_NAME}" "${NOTES_ARGS[@]}"
